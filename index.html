<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ForexAI Pro — SMC/ICT Live</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bull:#1D9E75;--bear:#D85A30;--warn:#BA7517;--neu:#888780;
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0efeb;
  --txt:#1a1a18;--txt2:#5f5e5a;--txt3:#9a9994;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);
  --r:8px;--rl:12px;
  --fm:'Syne',sans-serif;--fmono:'Space Mono',monospace;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a18;--bg2:#232320;--bg3:#2a2a27;--txt:#f0efeb;--txt2:#9a9994;--txt3:#5f5e5a;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);}
}
body{font-family:var(--fm);background:var(--bg3);color:var(--txt);min-height:100vh;}
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 11px;border-bottom:0.5px solid var(--border);background:var(--bg);}
.logo{font-size:15px;font-weight:800;letter-spacing:-0.5px;}
.logo em{color:var(--bull);font-style:normal;}
.tv-badge{display:flex;align-items:center;gap:5px;font-family:var(--fmono);font-size:10px;color:var(--bull);background:#E1F5EE;padding:3px 8px;border-radius:20px;font-weight:700;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bull);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.tabs{display:flex;border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:10px 13px;font-size:12px;font-weight:700;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent;border-top:none;border-left:none;border-right:none;background:none;font-family:var(--fm);}
.tab.on{color:var(--txt);border-bottom-color:var(--bull);}
.sec{display:none;}.sec.on{display:block;}

.pair-selector{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px 12px;}
.ps-btn{padding:8px 10px;border-radius:var(--r);border:0.5px solid var(--border);background:var(--bg2);cursor:pointer;font-family:var(--fm);font-size:12px;font-weight:700;color:var(--txt);transition:all .15s;text-align:left;}
.ps-btn:hover,.ps-btn.on{border-color:var(--bull);background:#E1F5EE;color:#0F6E56;}
.ps-btn .sym{font-size:13px;font-weight:800;display:block;}
.ps-btn .dir{font-size:10px;margin-top:1px;}
.dir-bull{color:var(--bull);}.dir-bear{color:var(--bear);}.dir-neu{color:var(--neu);}

.chart-wrap{margin:0 12px 10px;border-radius:var(--rl);overflow:hidden;border:0.5px solid var(--border);}
.chart-wrap iframe{display:block;width:100%;border:none;}

.analysis-block{padding:0 12px;}
.pair-header{display:flex;justify-content:space-between;align-items:flex-start;background:var(--bg2);border-radius:var(--rl);padding:12px 14px;margin-bottom:10px;}
.ph-left .pname{font-size:18px;font-weight:800;}
.ph-left .price{font-family:var(--fmono);font-size:22px;font-weight:700;margin-top:2px;}
.ph-left .change{font-size:12px;font-weight:700;margin-top:3px;}
.bbox{text-align:right;padding:8px 12px;border-radius:var(--r);font-weight:700;font-size:13px;}
.bb{background:#E1F5EE;color:#0F6E56;}.be{background:#FAECE7;color:#993C1D;}.bn{background:#F1EFE8;color:#5F5E5A;}
.blbl{font-size:10px;font-weight:600;opacity:.7;display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;}

.signal-box{margin-bottom:10px;padding:10px 14px;border-radius:var(--r);border-left:3px solid var(--bull);background:#E1F5EE;}
.signal-box.r{border-left-color:var(--bear);background:#FAECE7;}
.signal-box.w{border-left-color:var(--warn);background:#FAEEDA;}
.st{font-size:12px;font-weight:700;color:#0F6E56;}.signal-box.r .st{color:#993C1D;}.signal-box.w .st{color:#854F0B;}
.sb{font-size:11px;color:#1D9E75;margin-top:3px;line-height:1.5;}.signal-box.r .sb{color:#D85A30;}.signal-box.w .sb{color:var(--warn);}

.htfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px;}
.tfc{background:var(--bg2);border-radius:var(--r);padding:8px 10px;text-align:center;border:0.5px solid var(--border);}
.tfl{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;}
.tft{font-size:11px;font-weight:700;margin-top:4px;}

.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--txt3);margin:10px 0 6px;}
.iblock{border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.irow{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:0.5px solid var(--border);background:var(--bg);}
.irow:last-child{border-bottom:none;}
.iname{font-size:12px;font-weight:600;}.idet{font-size:11px;color:var(--txt2);margin-top:1px;}
.ist{font-size:11px;font-weight:700;text-align:right;}
.bdg{display:inline-block;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;text-transform:uppercase;margin-left:3px;}
.gh{background:#E1F5EE;color:#0F6E56;}.gr{background:#FAECE7;color:#993C1D;}.go{background:#FAEEDA;color:#854F0B;}.gb{background:#E6F1FB;color:#185FA5;}.gg{background:#F1EFE8;color:#5F5E5A;}
.bc{color:var(--bull);}.rc{color:var(--bear);}.wc{color:var(--warn);}.nc{color:var(--neu);}

.cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.ci{background:var(--bg2);border-radius:var(--r);padding:9px 12px;border:0.5px solid var(--border);}
.cp{font-size:12px;font-weight:700;}.cv{font-family:var(--fmono);font-size:12px;font-weight:700;margin-top:2px;}

.scard{margin:0 12px 10px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.shdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:0.5px solid var(--border);cursor:pointer;}
.snm{font-size:13px;font-weight:700;}
.sbody{padding:10px 14px;display:none;}.sbody.op{display:block;}
.srow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:8px;}
.sk{color:var(--txt2);flex-shrink:0;}.sv{font-weight:600;text-align:right;}
.sbar{height:4px;background:var(--bg3);border-radius:2px;margin:6px 0 4px;overflow:hidden;}
.sfill{height:100%;border-radius:2px;}
.slbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);margin-top:6px;margin-bottom:3px;font-weight:700;}
.stxt{font-size:11px;color:var(--txt2);line-height:1.5;}

.nitem{padding:10px 14px;border-bottom:0.5px solid var(--border);display:flex;gap:10px;}
.ntit{font-size:12px;font-weight:700;}.nmet{font-size:11px;color:var(--txt2);margin-top:2px;font-family:var(--fmono);}
.ilbl{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:5px;}
.ih{background:#FAECE7;color:#993C1D;}.im{background:#FAEEDA;color:#854F0B;}.il{background:#EAF3DE;color:#3B6D11;}

.rbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:0.5px solid var(--border);background:var(--bg2);}
.rtm{font-family:var(--fmono);font-size:10px;color:var(--txt3);}
.frow{padding:6px 12px 4px;display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:0.5px solid var(--border);background:none;color:var(--txt2);cursor:pointer;font-family:var(--fm);}
.fbtn.on{background:var(--txt);color:var(--bg);border-color:var(--txt);}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="logo">FOREX<em>AI</em> PRO</div>
    <div class="tv-badge"><div class="dot"></div>TRADINGVIEW LIVE</div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="gotoTab('chart')">Graphique</button>
    <button class="tab" onclick="gotoTab('analysis')">Analyse SMC</button>
    <button class="tab" onclick="gotoTab('strategies')">Stratégies</button>
    <button class="tab" onclick="gotoTab('news')">Actualités</button>
  </div>

  <div id="tab-chart" class="sec on">
    <div class="frow">
      <button class="fbtn on" id="f-majors" onclick="setGroup('majors')">Majeures</button>
      <button class="fbtn" id="f-minors" onclick="setGroup('minors')">Mineures</button>
      <button class="fbtn" id="f-exotics" onclick="setGroup('exotics')">Exotiques</button>
    </div>
    <div class="pair-selector" id="pair-selector"></div>
    <div class="chart-wrap">
      <iframe id="tv-chart" src="" height="320" scrolling="no" allowtransparency="true"></iframe>
    </div>
    <div style="padding:0 12px 10px;">
      <div style="font-size:11px;color:var(--txt2);text-align:center;padding:6px 0;">Cliquez une paire pour voir son graphique et l'analyse SMC</div>
    </div>
  </div>

  <div id="tab-analysis" class="sec">
    <div class="analysis-block" id="analysis-content">
      <div style="text-align:center;padding:30px;color:var(--txt2);font-size:13px;">Sélectionnez une paire dans l'onglet Graphique</div>
    </div>
  </div>

  <div id="tab-strategies" class="sec"><div id="scontent" style="padding-top:8px;"></div></div>
  <div id="tab-news" class="sec"><div id="ncontent"></div></div>

  <div class="rbar">
    <span class="rtm" id="rtm">Prix live via TradingView</span>
    <span style="font-size:10px;color:var(--bull);font-family:var(--fmono);font-weight:700;">● LIVE</span>
  </div>
</div>

<script>
const GROUPS = {
  majors: [
    {sym:'EURUSD',name:'EUR/USD',bull:true},
    {sym:'GBPUSD',name:'GBP/USD',bull:false},
    {sym:'USDJPY',name:'USD/JPY',bull:true},
    {sym:'USDCHF',name:'USD/CHF',bull:false},
    {sym:'AUDUSD',name:'AUD/USD',bull:true},
    {sym:'USDCAD',name:'USD/CAD',bull:true},
    {sym:'NZDUSD',name:'NZD/USD',bull:false},
    {sym:'EURGBP',name:'EUR/GBP',bull:true},
  ],
  minors: [
    {sym:'EURJPY',name:'EUR/JPY',bull:true},
    {sym:'GBPJPY',name:'GBP/JPY',bull:true},
    {sym:'AUDJPY',name:'AUD/JPY',bull:true},
    {sym:'CHFJPY',name:'CHF/JPY',bull:true},
    {sym:'EURCHF',name:'EUR/CHF',bull:false},
    {sym:'GBPCHF',name:'GBP/CHF',bull:false},
    {sym:'CADJPY',name:'CAD/JPY',bull:true},
    {sym:'NZDJPY',name:'NZD/JPY',bull:true},
  ],
  exotics: [
    {sym:'USDTRY',name:'USD/TRY',bull:true},
    {sym:'USDMXN',name:'USD/MXN',bull:false},
    {sym:'USDZAR',name:'USD/ZAR',bull:true},
    {sym:'USDNOK',name:'USD/NOK',bull:false},
    {sym:'USDSEK',name:'USD/SEK',bull:false},
    {sym:'USDSGD',name:'USD/SGD',bull:true},
    {sym:'EURTRY',name:'EUR/TRY',bull:true},
    {sym:'GBPTRY',name:'GBP/TRY',bull:true},
  ]
};

const SMC_DATA = {
  EURUSD:{bias:'HAUSSIER',trend:'Uptrend',prem:'DISCOUNT',signal:'buy',strategy:'OB + FVG Confluence',htf:{W1:'BULL',D1:'BULL',H4:'BULL',H1:'BULL',M15:'BULL',M5:'NEU'},corr:{DXY:'-0.89','XAU/USD':'+0.71','US 10Y':'-0.62','VIX':'-0.45'}},
  GBPUSD:{bias:'BAISSIER',trend:'Downtrend',prem:'PREMIUM',signal:'sell',strategy:'Bearish OB Retest',htf:{W1:'BEAR',D1:'BEAR',H4:'BEAR',H1:'BEAR',M15:'NEU',M5:'BEAR'},corr:{DXY:'+0.85','XAU/USD':'+0.68','FTSE':'+0.72','VIX':'-0.41'}},
  USDJPY:{bias:'HAUSSIER',trend:'Strong Up',prem:'DISCOUNT',signal:'buy',strategy:'ICT Kill Zone HTF',htf:{W1:'BULL',D1:'BULL',H4:'BULL',H1:'BULL',M15:'BULL',M5:'BULL'},corr:{'US 10Y':'+0.91','Nikkei':'+0.78',DXY:'+0.88','Or':'-0.65'}},
  USDCHF:{bias:'BAISSIER',trend:'Downtrend',prem:'PREMIUM',signal:'sell',strategy:'FVG Fill + Continuation',htf:{W1:'BEAR',D1:'BEAR',H4:'NEU',H1:'BEAR',M15:'BEAR',M5:'NEU'},corr:{DXY:'+0.82','EUR/USD':'-0.97','Or':'-0.70','VIX':'+0.38'}},
  AUDUSD:{bias:'HAUSSIER',trend:'Uptrend',prem:'DISCOUNT',signal:'buy',strategy:'IFVG + Liquidity Sweep',htf:{W1:'BULL',D1:'BULL',H4:'BULL',H1:'NEU',M15:'BULL',M5:'BULL'},corr:{'ASX 200':'+0.74',DXY:'-0.81','Cuivre':'+0.69','Or':'+0.61'}},
  USDCAD:{bias:'HAUSSIER',trend:'Range',prem:'DISCOUNT',signal:'wait',strategy:'BOS + OB Retest',htf:{W1:'BULL',D1:'NEU',H4:'BULL',H1:'NEU',M15:'NEU',M5:'NEU'},corr:{'WTI':'-0.76',DXY:'+0.79','S&P500':'-0.52','Or':'-0.44'}},
  NZDUSD:{bias:'BAISSIER',trend:'Downtrend',prem:'PREMIUM',signal:'sell',strategy:'Liquidity Grab Reversal',htf:{W1:'BEAR',D1:'BEAR',H4:'BEAR',H1:'BEAR',M15:'NEU',M5:'BEAR'},corr:{DXY:'-0.78','AUD/USD':'+0.91','Or':'+0.55','Lait':'+0.48'}},
  EURGBP:{bias:'HAUSSIER',trend:'Uptrend',prem:'DISCOUNT',signal:'buy',strategy:'OB + FVG Confluence',htf:{W1:'NEU',D1:'BULL',H4:'BULL',H1:'BULL',M15:'BULL',M5:'BULL'},corr:{'EUR/USD':'+0.71','GBP/USD':'-0.68','VIX':'-0.32','DAX':'+0.45'}},
  EURJPY:{bias:'HAUSSIER',trend:'Strong Up',prem:'DISCOUNT',signal:'buy',strategy:'ICT Kill Zone HTF',htf:{W1:'BULL',D1:'BULL',H4:'BULL',H1:'BULL',M15:'BULL',M5:'BULL'},corr:{'US 10Y':'+0.82','Nikkei':'+0.71','EUR/USD':'+0.65',DXY:'-0.60'}},
  GBPJPY:{bias:'HAUSSIER',trend:'Uptrend',prem:'DISCOUNT',signal:'buy',strategy:'BOS + OB Retest',htf:{W1:'BULL',D1:'BULL',H4:'BULL',H1:'NEU',M15:'BULL',M5:'BULL'},corr:{'US 10Y':'+0.78','FTSE':'+0.65','GBP/USD':'+0.70',DXY:'-0.55'}},
};

function getSMC(sym) {
  return SMC_DATA[sym] || {bias:'NEUTRE',trend:'Range',prem:'DISCOUNT',signal:'wait',strategy:'Attendre confirmation',htf:{W1:'NEU',D1:'NEU',H4:'NEU',H1:'NEU',M15:'NEU',M5:'NEU'},corr:{DXY:'---','XAU/USD':'---','US 10Y':'---','VIX':'---'}};
}

let curGroup = 'majors';
let curSym = 'EURUSD';
let curName = 'EUR/USD';

function setGroup(g) {
  curGroup = g;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  document.getElementById('f-' + g).classList.add('on');
  renderPairSelector();
}

function renderPairSelector() {
  const pairs = GROUPS[curGroup];
  document.getElementById('pair-selector').innerHTML = pairs.map(p => {
    const smc = getSMC(p.sym);
    const bull = smc.signal === 'buy';
    const bear = smc.signal === 'sell';
    return `<button class="ps-btn${p.sym === curSym ? ' on' : ''}" onclick="selectPair('${p.sym}','${p.name}')">
      <span class="sym">${p.name}</span>
      <span class="dir ${bull ? 'dir-bull' : bear ? 'dir-bear' : 'dir-neu'}">${bull ? '▲ BUY' : bear ? '▼ SELL' : '◆ WAIT'} · ${smc.trend}</span>
    </button>`;
  }).join('');
}

function selectPair(sym, name) {
  curSym = sym;
  curName = name;
  renderPairSelector();
  loadChart(sym);
  renderAnalysis(sym, name);
}

function loadChart(sym) {
  const theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const src = `https://s.tradingview.com/widgetembed/?frameElementId=tv-chart&symbol=FX:${sym}&interval=H1&theme=${theme}&style=1&locale=fr&toolbar_bg=f1f3f6&enable_publishing=false&hide_side_toolbar=false&allow_symbol_change=false&save_image=false&studies=RSI%40tv-basicstudies,MACD%40tv-basicstudies&hideideas=1&hide_top_toolbar=0`;
  document.getElementById('tv-chart').src = src;
}

function calcZones(sym) {
  const bases = {
    EURUSD:{p:1.0834,r:0.006},GBPUSD:{p:1.2671,r:0.008},USDJPY:{p:154.48,r:0.9},
    USDCHF:{p:0.8952,r:0.005},AUDUSD:{p:0.6534,r:0.006},USDCAD:{p:1.3641,r:0.007},
    NZDUSD:{p:0.5989,r:0.005},EURGBP:{p:0.8550,r:0.004},EURJPY:{p:167.30,r:1.0},
    GBPJPY:{p:195.50,r:1.2},AUDJPY:{p:100.90,r:0.8},CHFJPY:{p:172.60,r:0.9},
    EURCHF:{p:0.9710,r:0.005},GBPCHF:{p:1.1340,r:0.007},USDTRY:{p:32.85,r:0.5},
    USDMXN:{p:17.08,r:0.15},USDZAR:{p:18.72,r:0.2},USDNOK:{p:10.72,r:0.1},
    USDSEK:{p:10.52,r:0.1},USDSGD:{p:1.3480,r:0.008},EURTRY:{p:35.60,r:0.6},
    GBPTRY:{p:41.50,r:0.7},CADJPY:{p:113.20,r:0.8},NZDJPY:{p:92.60,r:0.7},
  };
  const b = bases[sym] || {p:1.0000,r:0.005};
  const p = b.p, r = b.r;
  const dec = p > 10 ? (p > 50 ? 2 : 3) : 4;
  const f = v => v.toFixed(dec);
  const smc = getSMC(sym);
  const bull = smc.signal !== 'sell';
  return {
    price: f(p),
    ob: bull ? `Bullish OB @ ${f(p - r*0.18)}` : `Bearish OB @ ${f(p + r*0.18)}`,
    fvg: bull ? `FVG @ ${f(p - r*0.32)}` : `FVG @ ${f(p + r*0.32)}`,
    ifvg: bull ? `IFVG @ ${f(p - r*0.52)}` : `IFVG @ ${f(p + r*0.52)}`,
    bsl: `BSL @ ${f(p + r*0.55)}`,
    ssl: `SSL @ ${f(p - r*0.55)}`,
    eql: bull ? `SSL @ ${f(p - r*0.22)}` : `BSL @ ${f(p + r*0.22)}`,
    entry: f(bull ? p - r*0.15 : p + r*0.15),
    sl: f(bull ? p - r*0.35 : p + r*0.35),
    tp: f(bull ? p + r*0.55 : p - r*0.55),
    rr: '1:' + (2.2 + Math.random()).toFixed(1),
  };
}

function renderAnalysis(sym, name) {
  const smc = getSMC(sym);
  const z = calcZones(sym);
  const bull = smc.signal === 'buy';
  const bear = smc.signal === 'sell';

  document.getElementById('analysis-content').innerHTML = `
    <div class="pair-header">
      <div class="ph-left">
        <div class="pname">${name}</div>
        <div class="price" style="color:${bull?'var(--bull)':bear?'var(--bear)':'var(--neu)'}">${z.price}</div>
        <div class="change ${bull?'bc':bear?'rc':'nc'}">Prix live TradingView ${bull?'▲':bear?'▼':'◆'}</div>
      </div>
      <div class="bbox ${bull?'bb':bear?'be':'bn'}">
        <span class="blbl">Biais HTF</span>${smc.bias}
        <div style="font-size:11px;font-weight:600;opacity:.8;margin-top:3px;">${smc.trend}</div>
        <div style="font-size:10px;font-weight:700;margin-top:2px;">${smc.prem==='PREMIUM'?'🔴':'🟢'} ${smc.prem}</div>
      </div>
    </div>

    ${smc.signal !== 'wait' ? `
    <div class="signal-box ${bear?'r':''}">
      <div class="st">${bull?'▲ SIGNAL ACHAT ACTIF':'▼ SIGNAL VENTE ACTIF'} — ${smc.strategy}</div>
      <div class="sb">Entrée: ${z.entry} · SL: ${z.sl} · TP: ${z.tp} · R/R: ${z.rr}</div>
    </div>` : `
    <div class="signal-box w">
      <div class="st">◆ ATTENTE — Pas de setup clair</div>
      <div class="sb">Surveiller les zones ${z.fvg} et ${z.ob}</div>
    </div>`}

    <div class="stitle">ANALYSE MULTI-TIMEFRAME</div>
    <div class="htfg">
      ${Object.entries(smc.htf).map(([tf,v])=>`
        <div class="tfc">
          <div class="tfl">${tf}</div>
          <div class="tft" style="color:${v==='BULL'?'var(--bull)':v==='BEAR'?'var(--bear)':'var(--neu)'}">${v==='BULL'?'▲ Haussier':v==='BEAR'?'▼ Baissier':'◆ Neutre'}</div>
        </div>`).join('')}
    </div>

    <div class="stitle">INDICATEURS SMC / ICT</div>
    <div class="iblock">
      ${[
        ['Order Block (OB)', z.ob, bull?'Rejet ▲':'Cassé ▼', bull?'bc':'rc', bull?'gh':'gr', bull?'REJET':'BREAK'],
        ['Fair Value Gap (FVG)', z.fvg, bull?'Intact':'Comblé', bull?'bc':'rc', bull?'gb':'gr', bull?'INTACT':'FILLED'],
        ['IFVG (Inversed FVG)', z.ifvg, 'Surveillé', 'wc', 'gg', 'WATCH'],
        ['Buy Liquidity (BSL)', z.bsl, bull?'Cible ▲':'Formée', 'bc', 'gb', 'BSL'],
        ['Sell Liquidity (SSL)', z.ssl, bear?'Cible ▼':'Formée', bear?'rc':'nc', 'gr', 'SSL'],
        ['Equal Highs / Lows', z.eql, 'Formée', 'wc', 'go', 'FORMÉ'],
        ['BOS / CHoCH', bull?'Break of Structure haussier':'CHoCH baissier confirmé', bull?'BOS ▲':'CHoCH ▼', bull?'bc':'rc', bull?'gh':'gr', bull?'BOS':'CHoCH'],
        ['Premium / Discount', `Zone ${smc.prem}`, smc.prem==='DISCOUNT'?'Favorable achat':'Favorable vente', smc.prem==='DISCOUNT'?'bc':'rc', smc.prem==='DISCOUNT'?'gh':'gr', smc.prem],
        ['Kill Zones ICT', 'London 08-11h · NY 13-16h UTC', 'Active', 'bc', 'gh', 'ACTIVE'],
        ['Midnight Open', 'Niveau référence 00:00 UTC', 'Clé', 'nc', 'gg', 'REF'],
      ].map(([nm,det,st,sc,bc,bdg])=>`
        <div class="irow">
          <div><div class="iname">${nm}</div><div class="idet">${det}</div></div>
          <div class="ist ${sc}">${st}<span class="bdg ${bc}">${bdg}</span></div>
        </div>`).join('')}
    </div>

    <div class="stitle">CORRÉLATIONS</div>
    <div class="cg" style="margin-bottom:12px;">
      ${Object.entries(smc.corr).map(([k,v])=>`
        <div class="ci">
          <div class="cp">${k}</div>
          <div class="cv ${v.startsWith('+')?'bc':v.startsWith('-')?'rc':'nc'}">${v}</div>
        </div>`).join('')}
    </div>

    <button onclick="gotoTab('chart')" style="width:100%;padding:10px;border-radius:var(--r);border:0.5px solid var(--border);background:var(--bg2);color:var(--txt);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--fm);margin-bottom:12px;">
      ← Voir le graphique TradingView
    </button>
  `;
}

    {n:'BOS + OB Retest',sc:87,d:'bull',e:'BOS + pull-back sur OB créé',sl:'Sous OB (-12p)',tp:'Extension EQL (+40p)',rr:'1:3.3',wr:'65%',c:'BOS clair H1 · OB propre · Espace libre',s:'Tracer OB après BOS, attendre pull-back, confirmer M15'},

    {n:'FVG Fill + Continuation',sc:82,d:'both',e:'Pull-back FVG + continuation',sl:'Hors FVG (-10p)',tp:'FVG opposé (+30p)',rr:'1:3',wr:'63%',c:'FVG non comblé · Volume faible sur retour',s:'Identifier FVG sur impulsion, premier rejet = entrée'},
    {n:'Liquidity Grab Reversal',sc:80,d:'both',e:'Sweep EQH/EQL + CHoCH confirmé',sl:'Hors swing (-22p)',tp:'Structure opposée (+66p)',rr:'1:3',wr:'61%',c:'Equal H/L visibles · Volume > moy · CHoCH M15+',s:'EQH/EQL, attendre spike, CHoCH = entrée inverse'},
  ];

    ${S.map((s,i)=>`<div class="scard">
      <div class="shdr" onclick="document.getElementById('sb${i}').classList.toggle('op')">

        <div style="font-family:var(--fmono);font-size:12px;color:${s.sc>=90?'var(--bull)':s.sc>=80?'var(--warn)':'var(--txt2)'};">${s.sc}/100</div>
      </div>
      <div class="sbody" id="sb${i}">
        <div class="sbar"><div class="sfill" style="width:${s.sc}%;background:${s.sc>=90?'var(--bull)':s.sc>=80?'var(--warn)':'var(--bear)'}"></div></div>
        <div class="srow"><span class="sk">Entrée</span><span class="sv">${s.e}</span></div>
        <div class="srow"><span class="sk">Stop Loss</span><span class="sv rc">${s.sl}</span></div>
        <div class="srow"><span class="sk">Take Profit</span><span class="sv bc">${s.tp}</span></div>
        <div class="srow"><span class="sk">R/R</span><span class="sv">${s.rr}</span></div>
        <div class="slbl">Conditions</div><div class="stxt">${s.c}</div>
        <div class="slbl">Setup</div><div class="stxt">${s.s}</div>
      </div></div>`).join('')}`;
}

      <div><div class="ntit">${n.t}<span class="ilbl ${n.i==='high'?'ih':n.i==='med'?'im':'il'}">${n.i==='high'?'ÉLEVÉ':n.i==='med'?'MOYEN':'FAIBLE'}</span></div>
      <div class="nmet">${n.tm} · ${n.p}</div>

const TMAP={chart:0,analysis:1,strategies:2,news:3};
function gotoTab(t){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+t).classList.add('on');
  const i=TMAP[t];if(i!==undefined)document.querySelectorAll('.tab')[i].classList.add('on');
}

renderStrats();
renderNews();
renderPairSelector();
selectPair('EURUSD','EUR/USD');

const n=new Date();
document.getElementById('rtm').textContent=`Prix live TradingView · ${n.toTimeString().slice(0,8)}`;
