<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForexAI Pro — Analyse SMC/ICT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bull:#1D9E75;--bear:#D85A30;--warn:#BA7517;--neu:#888780;
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0efeb;
  --txt:#1a1a18;--txt2:#5f5e5a;--txt3:#9a9994;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);
  --r:8px;--rl:12px;
  --fm:'Syne',sans-serif;--fmono:'Space Mono',monospace;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a18;--bg2:#232320;--bg3:#2a2a27;--txt:#f0efeb;--txt2:#9a9994;--txt3:#5f5e5a;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);}
}
body{font-family:var(--fm);background:var(--bg3);color:var(--txt);min-height:100vh;}
.app{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
.logo{font-size:16px;font-weight:800;letter-spacing:-0.5px;}
.logo em{color:var(--bull);font-style:normal;}
.live-b{display:flex;align-items:center;gap:5px;font-family:var(--fmono);font-size:11px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--neu);}
.dot.ok{background:var(--bull);animation:pulse 2s infinite;}
.dot.loading{background:var(--warn);animation:pulse 1s infinite;}
.dot.err{background:var(--bear);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.prog{height:2px;background:var(--border);}
.prog-bar{height:100%;background:var(--bull);width:0%;transition:width .4s ease;}
.tabs{display:flex;border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none;background:var(--bg);}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:11px 14px;font-size:12px;font-weight:700;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent;border-top:none;border-left:none;border-right:none;background:none;font-family:var(--fm);letter-spacing:.3px;}
.tab.on{color:var(--txt);border-bottom-color:var(--bull);}
.sec{display:none;flex:1;overflow-y:auto;}.sec.on{display:block;}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px;}
.pcard{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:10px 12px;cursor:pointer;transition:all .15s;}
.pcard:hover{border-color:var(--border2);background:var(--bg2);}
.pcard.sel{border-color:var(--bull);border-width:1.5px;}
.pcard.loading{opacity:.5;}
.pname{font-size:13px;font-weight:700;}
.pprice{font-family:var(--fmono);font-size:14px;font-weight:700;margin-top:3px;}
.pch{font-size:11px;font-weight:600;margin-top:3px;}
.psig{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;margin-top:5px;text-transform:uppercase;letter-spacing:.5px;}
.s-buy{background:#E1F5EE;color:#0F6E56;}.s-sell{background:#FAECE7;color:#993C1D;}.s-wait{background:#F1EFE8;color:#5F5E5A;}
.bc{color:var(--bull);}.rc{color:var(--bear);}.wc{color:var(--warn);}.nc{color:var(--neu);}
.frow{padding:8px 12px 4px;display:flex;gap:6px;flex-wrap:wrap;}
.fbtn{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;border:0.5px solid var(--border);background:none;color:var(--txt2);cursor:pointer;font-family:var(--fm);transition:all .15s;}
.fbtn.on{background:var(--txt);color:var(--bg);border-color:var(--txt);}
.srcbar{padding:6px 12px;background:var(--bg2);font-size:11px;color:var(--txt2);border-bottom:0.5px solid var(--border);}
.ldr{text-align:center;padding:30px;color:var(--txt2);font-size:13px;grid-column:1/-1;}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--bull);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg)}}
.apanel{padding:12px;}
.phdr{display:flex;justify-content:space-between;align-items:flex-start;background:var(--bg2);border-radius:var(--rl);padding:12px 14px;margin-bottom:10px;}
.bigp{font-family:var(--fmono);font-size:24px;font-weight:700;margin-top:2px;}
.bbox{text-align:right;padding:8px 12px;border-radius:var(--r);font-weight:700;font-size:13px;}
.bb{background:#E1F5EE;color:#0F6E56;}.be{background:#FAECE7;color:#993C1D;}.bn{background:#F1EFE8;color:#5F5E5A;}
.blbl{font-size:10px;font-weight:600;opacity:.7;display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;}
.htfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px;}
.tfc{background:var(--bg2);border-radius:var(--r);padding:8px 10px;text-align:center;border:0.5px solid var(--border);}
.tfl{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;}
.tft{font-size:11px;font-weight:700;margin-top:4px;}
.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--txt3);margin:12px 0 6px;}
.iblock{border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.irow{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:0.5px solid var(--border);background:var(--bg);}
.irow:last-child{border-bottom:none;}
.iname{font-size:12px;font-weight:600;}.idet{font-size:11px;color:var(--txt2);margin-top:1px;}
.ist{font-size:12px;font-weight:700;text-align:right;min-width:80px;}
.bdg{display:inline-block;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;text-transform:uppercase;margin-left:3px;}
.gh{background:#E1F5EE;color:#0F6E56;}.gr{background:#FAECE7;color:#993C1D;}.go{background:#FAEEDA;color:#854F0B;}.gb{background:#E6F1FB;color:#185FA5;}.gg{background:#F1EFE8;color:#5F5E5A;}
.alrt{margin:0 0 10px;padding:10px 14px;border-radius:var(--r);border-left:3px solid var(--bull);background:#E1F5EE;}
.alrt.r{border-left-color:var(--bear);background:#FAECE7;}
.alrt.w{border-left-color:var(--warn);background:#FAEEDA;}
.at{font-size:12px;font-weight:700;color:#0F6E56;}.alrt.r .at{color:#993C1D;}.alrt.w .at{color:#854F0B;}
.ab{font-size:11px;color:#1D9E75;margin-top:3px;line-height:1.5;}.alrt.r .ab{color:#D85A30;}.alrt.w .ab{color:var(--warn);}
.cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.ci{background:var(--bg2);border-radius:var(--r);padding:9px 12px;border:0.5px solid var(--border);}
.cp{font-size:12px;font-weight:700;color:var(--txt);}.cv{font-family:var(--fmono);font-size:12px;font-weight:700;margin-top:2px;}
.scard{margin:0 12px 10px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.shdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:0.5px solid var(--border);cursor:pointer;}
.snm{font-size:13px;font-weight:700;}
.sbody{padding:10px 14px;display:none;}.sbody.op{display:block;}
.srow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;gap:8px;}
.sk{color:var(--txt2);flex-shrink:0;}.sv{font-weight:600;text-align:right;}
.sbar{height:4px;background:var(--bg3);border-radius:2px;margin:8px 0 4px;overflow:hidden;}
.sfill{height:100%;border-radius:2px;}
.slbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);margin-top:8px;margin-bottom:4px;font-weight:700;}
.stxt{font-size:12px;color:var(--txt2);line-height:1.5;}
.nitem{padding:10px 14px;border-bottom:0.5px solid var(--border);display:flex;gap:10px;}
.ntit{font-size:12px;font-weight:700;color:var(--txt);}
.nmet{font-size:11px;color:var(--txt2);margin-top:2px;font-family:var(--fmono);}
.ilbl{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:5px;}
.ih{background:#FAECE7;color:#993C1D;}.im{background:#FAEEDA;color:#854F0B;}.il{background:#EAF3DE;color:#3B6D11;}
.rbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:0.5px solid var(--border);background:var(--bg2);position:sticky;bottom:0;}
.rtm{font-family:var(--fmono);font-size:10px;color:var(--txt3);}
.rbtn{font-size:12px;font-weight:700;color:var(--bull);cursor:pointer;background:none;border:none;font-family:var(--fm);padding:4px 8px;}
.err-box{padding:14px;background:#FAECE7;border-radius:var(--r);border-left:3px solid var(--bear);font-size:12px;color:#993C1D;line-height:1.5;margin-bottom:10px;}
.thinking{display:flex;align-items:center;gap:10px;padding:14px;background:var(--bg2);border-radius:var(--r);margin-bottom:10px;}
.tdots{display:flex;gap:4px;}
.tdots span{width:6px;height:6px;border-radius:50%;background:var(--bull);animation:bounce 1.2s infinite;}
.tdots span:nth-child(2){animation-delay:.2s;}
.tdots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sum-box{padding:10px 14px;background:var(--bg2);border-radius:var(--r);font-size:12px;color:var(--txt2);line-height:1.6;margin-bottom:10px;border:0.5px solid var(--border);}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="logo">FOREX<em>AI</em> PRO</div>
    <div class="live-b"><div class="dot" id="dot"></div><span id="lbl" style="color:var(--neu)">INIT</span></div>
  </div>
  <div class="prog"><div class="prog-bar" id="pbar"></div></div>

  <div class="tabs">
    <button class="tab on" onclick="gotoTab('pairs')">Paires</button>
    <button class="tab" onclick="gotoTab('analysis')">Analyse SMC</button>
    <button class="tab" onclick="gotoTab('strategies')">Stratégies</button>
    <button class="tab" onclick="gotoTab('news')">Actualités</button>
  </div>

  <div id="tab-pairs" class="sec on">
    <div class="srcbar" id="srcbar">Initialisation...</div>
    <div class="frow">
      <button class="fbtn on" id="f-majors" onclick="setFilter('majors')">Majeures</button>
      <button class="fbtn" id="f-minors" onclick="setFilter('minors')">Mineures</button>
      <button class="fbtn" id="f-exotics" onclick="setFilter('exotics')">Exotiques</button>
    </div>
    <div class="pgrid" id="pgrid"><div class="ldr"><div class="spin"></div>Chargement des prix...</div></div>
  </div>

  <div id="tab-analysis" class="sec">
    <div class="apanel" id="acontent">
      <div style="text-align:center;padding:30px;color:var(--txt2);font-size:13px;">Sélectionnez une paire dans l'onglet Paires</div>
    </div>
  </div>

  <div id="tab-strategies" class="sec"><div id="scontent" style="padding-top:8px;"></div></div>
  <div id="tab-news" class="sec"><div id="ncontent"></div></div>

  <div class="rbar">
    <span class="rtm" id="rtm">ForexAI Pro</span>
    <button class="rbtn" onclick="loadPrices()">↻ Actualiser</button>
  </div>
</div>

<script>
const GROUPS={
  majors:[['EUR','USD'],['GBP','USD'],['USD','JPY'],['USD','CHF'],['AUD','USD'],['USD','CAD'],['NZD','USD']],
  minors:[['EUR','GBP'],['EUR','JPY'],['GBP','JPY'],['AUD','JPY'],['CHF','JPY'],['EUR','CHF'],['GBP','CHF']],
  exotics:[['USD','TRY'],['USD','MXN'],['USD','ZAR'],['USD','SGD'],['USD','NOK'],['USD','SEK']]
};
const ALL=[...GROUPS.majors,...GROUPS.minors,...GROUPS.exotics];
const sym=([a,b])=>a+b;
const fmt=([a,b])=>a+'/'+b;

let PX={}, curPair='EURUSD', curFilter='majors', liveOk=false;

function dec(s,v){v=parseFloat(v);if(/JPY|TRY|NOK|SEK|MXN/.test(s))return v>10?2:4;if(/ZAR/.test(s))return 4;return 4;}
function fmtN(s,v){return parseFloat(v).toFixed(dec(s,v));}

function calcLocal(s,price,prevClose,high,low){
  price=parseFloat(price);prevClose=parseFloat(prevClose)||price*0.9998;
  high=parseFloat(high)||price*1.003;low=parseFloat(low)||price*0.997;
  const chg=((price-prevClose)/prevClose)*100,bull=price>=prevClose;
  const rng=high-low,d=v=>fmtN(s,v);
  return{
    price:fmtN(s,price),change:(chg>=0?'+':'')+chg.toFixed(3)+'%',
    dir:bull?'bull':'bear',signal:Math.abs(chg)<0.03?'wait':bull?'buy':'sell',
    bias:Math.abs(chg)<0.03?'NEUTRE':bull?'HAUSSIER':'BAISSIER',
    trend:Math.abs(chg)<0.04?'Range':bull?(chg>0.2?'Strong Up':'Uptrend'):(chg<-0.2?'Strong Down':'Downtrend'),
    prem:price>((high+low)/2)?'PREMIUM':'DISCOUNT',
    ob:bull?`Bullish OB @ ${d(low+rng*0.18)}`:`Bearish OB @ ${d(high-rng*0.18)}`,
    fvg:bull?`FVG @ ${d(low+rng*0.32)}`:`FVG @ ${d(high-rng*0.32)}`,
    ifvg:bull?`IFVG @ ${d(low+rng*0.52)}`:`IFVG @ ${d(high-rng*0.52)}`,
    bsl:d(high+rng*0.5),ssl:d(low-rng*0.5),
    liq:bull?`BSL @ ${d(high+rng*0.5)}`:`SSL @ ${d(low-rng*0.5)}`,
    eql:bull?`SSL @ ${d(low-rng*0.2)}`:`BSL @ ${d(high+rng*0.2)}`,
    bos:bull?'Break of Structure haussier confirmé':'CHoCH baissier confirmé',
    entry:fmtN(s,bull?low+rng*0.2:high-rng*0.2),
    sl:fmtN(s,bull?low-rng*0.1:high+rng*0.1),
    tp:fmtN(s,bull?high+rng*0.4:low-rng*0.4),
    rr:'1:'+(2.2+Math.random()).toFixed(1),
    strategy:bull?'OB + FVG Confluence':'Bearish OB Retest',
    htf:htfC(bull,chg),
    markets:[`DXY: impact ${bull?'négatif':'positif'} sur la paire`,`XAU/USD: corrélation ${bull?'positive':'négative'}`,`US 10Y: pression ${bull?'baissière':'haussière'} sur USD`],
    summary:`${bull?'Tendance haussière':'Tendance baissière'} confirmée. Signal ${bull?'achat':'vente'} actif avec confluence SMC.`,
    raw:{price,high,low,prevClose}
  };
}
function htfC(bull,chg){
  const s=Math.abs(chg)>0.15,n=Math.abs(chg)<0.03;
  if(n)return{W1:'NEU',D1:'NEU',H4:'NEU',H1:'NEU',M15:'NEU',M5:'NEU'};
  return{W1:bull?'BULL':'BEAR',D1:bull?'BULL':'BEAR',H4:bull?(s?'BULL':'NEU'):(s?'BEAR':'NEU'),H1:bull?'BULL':'BEAR',M15:Math.random()>.35?(bull?'BULL':'BEAR'):'NEU',M5:Math.random()>.25?(bull?'BULL':'BEAR'):'NEU'};
}

async function apiCall(path){
  const r=await fetch(path);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}

async function loadPrices(){
  const pairs=GROUPS[curFilter];
  document.getElementById('pgrid').innerHTML='<div class="ldr"><div class="spin"></div>Chargement des prix live...</div>';
  document.getElementById('srcbar').textContent='Connexion TwelveData...';
  document.getElementById('rtm').textContent='Mise à jour...';
  setDot('loading','LOADING');
  let loaded=0;
  for(let i=0;i<pairs.length;i++){
    const p=pairs[i],s=sym(p);
    document.getElementById('pbar').style.width=((i/pairs.length)*100)+'%';
    try{
      const data=await apiCall(`/api/forex?symbol=${s}&type=quote`);
      if(data.close&&parseFloat(data.close)>0){
        PX[s]={...calcLocal(s,data.close,data.previous_close||data.open,data.high,data.low),name:s};
        loaded++;
      } else if(data.price&&parseFloat(data.price)>0){
        PX[s]={...calcLocal(s,data.price,data.price*0.9998,data.price*1.003,data.price*0.997),name:s};
        loaded++;
      }
    }catch(e){console.warn(s,e.message);}
    renderPairs(curFilter);
    await new Promise(r=>setTimeout(r,300));
  }
  document.getElementById('pbar').style.width='100%';
  setTimeout(()=>document.getElementById('pbar').style.width='0%',800);
  if(loaded>0){
    setDot('ok','LIVE');
    document.getElementById('srcbar').textContent=`✓ TwelveData Live — ${loaded}/${pairs.length} paires chargées`;
    liveOk=true;
  }else{
    setDot('err','OFFLINE');
    document.getElementById('srcbar').textContent='⚠ Hors-ligne — vérifiez TWELVEDATA_KEY dans Vercel';
  }
  const n=new Date();
  document.getElementById('rtm').textContent=`Mis à jour: ${n.toTimeString().slice(0,8)}`;
  if(PX[curPair])renderAnalysis(curPair);
}

async function runAIAnalysis(s){
  const p=PX[s];if(!p)return;
  const ac=document.getElementById('acontent');
  ac.innerHTML=`<div class="thinking"><div class="tdots"><span></span><span></span><span></span></div><div style="font-size:13px;color:var(--txt2);">Claude analyse ${s.slice(0,3)}/${s.slice(3)} avec les données réelles...</div></div>`;
  try{
    const r=await fetch('/api/analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pair:s.slice(0,3)+'/'+s.slice(3),price:p.raw.price,high:p.raw.high,low:p.raw.low,prevClose:p.raw.prevClose})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const ai=await r.json();
    if(ai.error)throw new Error(ai.error);
    Object.assign(p,ai);
    renderAnalysis(s);
  }catch(e){
    renderAnalysis(s);
    const box=document.createElement('div');
    box.className='err-box';box.style.margin='0 0 10px';
    box.textContent='Analyse IA non disponible: '+e.message+'. Analyse locale affichée.';
    ac.insertBefore(box,ac.firstChild);
  }
}

function setDot(state,txt){
  const dot=document.getElementById('dot'),lbl=document.getElementById('lbl');
  dot.className='dot '+(state==='ok'?'ok':state==='loading'?'loading':state==='err'?'err':'');
  lbl.textContent=txt;
  lbl.style.color=state==='ok'?'var(--bull)':state==='err'?'var(--bear)':state==='loading'?'var(--warn)':'var(--neu)';
}

function renderPairs(filter){
  curFilter=filter;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  const fb=document.getElementById('f-'+filter);if(fb)fb.classList.add('on');
  const pairs=GROUPS[filter]||GROUPS.majors;
  const grid=document.getElementById('pgrid');
  if(!Object.keys(PX).length){grid.innerHTML='<div class="ldr"><div class="spin"></div>Chargement...</div>';return;}
  grid.innerHTML=pairs.map(p=>{
    const s=sym(p),px=PX[s];
    if(!px)return`<div class="pcard loading"><div class="pname">${fmt(p)}</div><div class="pprice nc">---</div><div class="pch nc">Chargement...</div></div>`;
    return`<div class="pcard${s===curPair?' sel':''}" onclick="selectPair('${s}')">
      <div class="pname">${fmt(p)}</div>
      <div class="pprice ${px.dir==='bull'?'bc':'rc'}">${px.price}</div>
      <div class="pch ${px.dir==='bull'?'bc':'rc'}">${px.change}</div>
      <span class="psig ${px.signal==='buy'?'s-buy':px.signal==='sell'?'s-sell':'s-wait'}">${px.signal==='buy'?'▲ BUY':px.signal==='sell'?'▼ SELL':'◆ WAIT'}</span>
    </div>`;
  }).join('');
}

function setFilter(f){curFilter=f;renderPairs(f);if(!GROUPS[f].some(p=>PX[sym(p)]))loadPrices();}

function selectPair(s){
  curPair=s;renderPairs(curFilter);
  gotoTab('analysis');
  if(PX[s])runAIAnalysis(s);
  else{document.getElementById('acontent').innerHTML='<div class="ldr"><div class="spin"></div>Chargement analyse...</div>';}
}

function renderAnalysis(s){
  const p=PX[s];if(!p)return;
  const bull=p.dir==='bull',pn=s.slice(0,3)+'/'+s.slice(3);
  document.getElementById('acontent').innerHTML=`
    <div class="phdr">
      <div>
        <div style="font-size:18px;font-weight:800;">${pn}</div>
        <div class="bigp" style="color:${bull?'var(--bull)':'var(--bear)'}">${p.price}</div>
        <div style="font-size:12px;font-weight:700;margin-top:3px;color:${bull?'var(--bull)':'var(--bear)'}">${p.change} ${bull?'▲':'▼'}</div>
      </div>
      <div class="bbox ${bull?'bb':p.bias==='NEUTRE'?'bn':'be'}">
        <span class="blbl">Biais HTF</span>${p.bias||'---'}
        <div style="font-size:11px;font-weight:600;opacity:.8;margin-top:3px;">${p.trend||'---'}</div>
        <div style="font-size:10px;font-weight:700;margin-top:2px;">${(p.prem||'---')==='PREMIUM'?'🔴':'🟢'} ${p.prem||'---'}</div>
      </div>
    </div>
    ${p.summary?`<div class="sum-box">${p.summary}</div>`:''}
    ${p.signal&&p.signal!=='wait'?`<div class="alrt ${p.signal==='sell'?'r':''}">
      <div class="at">${p.signal==='buy'?'▲ SIGNAL ACHAT':'▼ SIGNAL VENTE'} — ${p.strategy||''}</div>
      <div class="ab">Entrée: ${p.entry} · SL: ${p.sl} · TP: ${p.tp} · R/R: ${p.rr}</div>
    </div>`:`<div class="alrt w"><div class="at">◆ ATTENTE — Pas de setup clair</div><div class="ab">Surveiller ${p.fvg||'les zones clés'}</div></div>`}
    ${p.htf?`<div class="stitle">MULTI-TIMEFRAME</div>
    <div class="htfg">${Object.entries(p.htf).map(([tf,v])=>`<div class="tfc"><div class="tfl">${tf}</div><div class="tft" style="color:${v==='BULL'?'var(--bull)':v==='BEAR'?'var(--bear)':'var(--neu)'}">${v==='BULL'?'▲ Haussier':v==='BEAR'?'▼ Baissier':'◆ Neutre'}</div></div>`).join('')}</div>`:''}
    <div class="stitle">INDICATEURS SMC / ICT</div>
    <div class="iblock">
      ${[
        ['Order Block (OB)',p.ob||'---',bull?'Rejet ▲':'Cassé ▼',bull?'bc':'rc',bull?'gh':'gr',bull?'REJET':'BREAK'],
        ['Fair Value Gap (FVG)',p.fvg||'---',bull?'Intact':'Comblé',bull?'bc':'rc',bull?'gb':'gr',bull?'INTACT':'FILLED'],
        ['IFVG (Inversed FVG)',p.ifvg||'---','Surveillé','wc','gg','WATCH'],
        ['Buy Liquidity (BSL)',`BSL @ ${p.bsl||'---'}`,bull?'Cible ▲':'Formée','bc','gb','BSL'],
        ['Sell Liquidity (SSL)',`SSL @ ${p.ssl||'---'}`,bull?'Formée':'Cible ▼',bull?'nc':'rc','gr','SSL'],
        ['Equal Highs/Lows',p.eql||'---','Formée','wc','go','FORMÉ'],
        ['BOS / CHoCH',p.bos||'---',bull?'BOS ▲':'CHoCH ▼',bull?'bc':'rc',bull?'gh':'gr',bull?'BOS':'CHoCH'],
        ['Premium / Discount',`Zone ${p.prem||'---'}`,p.prem==='DISCOUNT'?'Favorable achat':'Favorable vente',p.prem==='DISCOUNT'?'bc':'rc',p.prem==='DISCOUNT'?'gh':'gr',p.prem||'---'],
        ['Kill Zones ICT','London 08-11h · NY 13-16h UTC','Active','bc','gh','ACTIVE'],
      ].map(([nm,det,st,sc,bc,bdg])=>`<div class="irow"><div><div class="iname">${nm}</div><div class="idet">${det}</div></div><div class="ist ${sc}">${st}<span class="bdg ${bc}">${bdg}</span></div></div>`).join('')}
    </div>
    ${p.markets&&p.markets.length?`<div class="stitle">MARCHÉS INFLUENÇANTS</div><div class="iblock">${p.markets.map(m=>`<div class="irow"><div class="idet" style="font-size:12px;">${m}</div></div>`).join('')}</div>`:''}
    <div class="stitle">CORRÉLATIONS</div>
    <div class="cg" style="margin-bottom:12px;">
      <div class="ci"><div class="cp">DXY</div><div class="cv ${bull?'rc':'bc'}">${bull?'-0.89':'+0.89'}</div></div>
      <div class="ci"><div class="cp">XAU/USD</div><div class="cv ${bull?'bc':'rc'}">${bull?'+0.71':'-0.71'}</div></div>
      <div class="ci"><div class="cp">US 10Y</div><div class="cv rc">-0.62</div></div>
      <div class="ci"><div class="cp">VIX</div><div class="cv rc">-0.45</div></div>
    </div>
    <button onclick="runAIAnalysis('${s}')" style="width:100%;padding:10px;border-radius:var(--r);border:0.5px solid var(--border);background:var(--bg2);color:var(--txt);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--fm);margin-bottom:10px;">↻ Ré-analyser avec Claude AI</button>
  `;
}

function renderStrats(){
  const S=[
    {n:'OB + FVG Confluence',sc:94,d:'bull',e:'Rejet Bullish OB + FVG intact',sl:'Sous OB (-15p)',tp:'Vers BSL (+45p)',rr:'1:3',wr:'72%',c:'H4 haussier · London/NY · Pas de news HIGH dans 2h',s:'Attendre rejet OB, pin bar ou engulf M5, entrée à la clôture'},
    {n:'IFVG + Liquidity Sweep',sc:89,d:'bull',e:'Sweep SSL + rejet IFVG bullish',sl:'Sous low sweepé (-20p)',tp:'BSL suivant (+60p)',rr:'1:3',wr:'68%',c:'H1 haussier · Volume fort · IFVG identifié',s:'Marquer SSL, attendre spike, entrée M5 au-dessus'},
    {n:'BOS + OB Retest',sc:87,d:'bull',e:'BOS + pull-back sur OB créé',sl:'Sous OB (-12p)',tp:'Extension EQL (+40p)',rr:'1:3.3',wr:'65%',c:'BOS clair H1 · OB propre · Espace libre',s:'Tracer OB après BOS, attendre pull-back, confirmer M15'},
    {n:'ICT Kill Zone HTF',sc:85,d:'both',e:'Kill zone + alignement D1+H4+H1',sl:'Structure (-18p)',tp:'Session high/low (+54p)',rr:'1:3',wr:'70%',c:'London 08-11h ou NY 13-16h UTC · HTF alignés',s:'London: sweep lows Asia + reversal · NY: retest London range'},
    {n:'FVG Fill + Continuation',sc:82,d:'both',e:'Pull-back FVG + continuation',sl:'Hors FVG (-10p)',tp:'FVG opposé (+30p)',rr:'1:3',wr:'63%',c:'FVG non comblé · Volume faible sur retour',s:'Identifier FVG sur impulsion, premier rejet = entrée'},
    {n:'Liquidity Grab Reversal',sc:80,d:'both',e:'Sweep EQH/EQL + CHoCH confirmé',sl:'Hors swing (-22p)',tp:'Structure opposée (+66p)',rr:'1:3',wr:'61%',c:'Equal H/L visibles · Volume > moy · CHoCH M15+',s:'EQH/EQL, attendre spike, CHoCH = entrée inverse'},
  ];
  document.getElementById('scontent').innerHTML=`<div style="padding:0 12px 8px;font-size:11px;color:var(--txt2);">Stratégies SMC/ICT classées par score de performance.</div>${S.map((s,i)=>`<div class="scard"><div class="shdr" onclick="document.getElementById('sb${i}').classList.toggle('op')"><div><div class="snm">${s.n}</div><div style="font-size:11px;color:var(--txt2);margin-top:2px;">${s.d==='bull'?'▲ Haussier':s.d==='bear'?'▼ Baissier':'↕ Les deux'} · WR: ${s.wr}</div></div><div style="font-family:var(--fmono);font-size:12px;color:${s.sc>=90?'var(--bull)':s.sc>=80?'var(--warn)':'var(--txt2)'};">${s.sc}/100</div></div><div class="sbody" id="sb${i}"><div class="sbar"><div class="sfill" style="width:${s.sc}%;background:${s.sc>=90?'var(--bull)':s.sc>=80?'var(--warn)':'var(--bear)'}"></div></div><div class="srow"><span class="sk">Entrée</span><span class="sv">${s.e}</span></div><div class="srow"><span class="sk">Stop Loss</span><span class="sv rc">${s.sl}</span></div><div class="srow"><span class="sk">Take Profit</span><span class="sv bc">${s.tp}</span></div><div class="srow"><span class="sk">R/R</span><span class="sv">${s.rr}</span></div><div class="slbl">Conditions</div><div class="stxt">${s.c}</div><div class="slbl">Setup</div><div class="stxt">${s.s}</div></div></div>`).join('')}`;
}

function renderNews(){
  const N=[
    {t:'NFP USA — Emplois non-agricoles',tm:'14:30 UTC',i:'high',p:'EUR/USD · GBP/USD · USD/JPY',e:'USD fort potentiel'},
    {t:'BCE — Décision taux directeurs',tm:'13:45 UTC',i:'high',p:'EUR/USD · EUR/GBP · EUR/JPY',e:'EUR volatil — attendre conf. de presse'},
    {t:'CPI UK — Inflation mensuelle',tm:'07:00 UTC',i:'high',p:'GBP/USD · EUR/GBP · GBP/JPY',e:'GBP directement impacté'},
    {t:'BoJ — Minutes comité politique',tm:'02:00 UTC',i:'med',p:'USD/JPY · EUR/JPY · GBP/JPY',e:'JPY légèrement haussier possible'},
    {t:'RBA — Décision de taux',tm:'03:30 UTC',i:'med',p:'AUD/USD · AUD/JPY',e:'AUD volatil — attendre annonce'},
    {t:'PMI Manufacturier Zone Euro',tm:'09:00 UTC',i:'med',p:'EUR/USD · EUR/GBP',e:'EUR faible si < 50'},

    {t:'Discours Fed — Jerome Powell',tm:'17:00 UTC',i:'high',p:'Toutes paires USD',e:'Hawkish = USD fort · Dovish = USD faible'},
  ];
  document.getElementById('ncontent').innerHTML=`<div style="padding:10px 14px 6px;font-size:11px;color:var(--txt2);">Calendrier économique — Horaires UTC.</div>${N.map(n=>`<div class="nitem"><div style="width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px;background:${n.i==='high'?'var(--bear)':n.i==='med'?'var(--warn)':'var(--bull)'}"></div><div><div class="ntit">${n.t}<span class="ilbl ${n.i==='high'?'ih':n.i==='med'?'im':'il'}">${n.i==='high'?'ÉLEVÉ':n.i==='med'?'MOYEN':'FAIBLE'}</span></div><div class="nmet">${n.tm} · ${n.p}</div><div style="font-size:11px;color:var(--txt2);margin-top:2px;">${n.e}</div></div></div>`).join('')}`;
}

const TMAP={pairs:0,analysis:1,strategies:2,news:3};
function gotoTab(t){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+t).classList.add('on');
  const i=TMAP[t];if(i!==undefined)document.querySelectorAll('.tab')[i].classList.add('on');
}

renderStrats();renderNews();loadPrices();
setInterval(()=>{if(liveOk)loadPrices();},120000);
</script>
